name: Ошибка
description: Сообщить об ошибке в работе приложения
title: "[Ошибка] "
labels: ["bug"]
projects: ["study-ai-assistant/1"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке! Чем точнее описание, тем быстрее её исправят.
        Не прикладывайте ключи API, токены, пароли и личные данные — репозиторий публичный.
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что нужно сделать, чтобы увидеть ошибку
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле. Приложите скриншот или текст ошибки, если есть.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Устройство / эмулятор, версия ОС, версия приложения или коммит, браузер (если применимо)
      placeholder: |
        - Устройство: Pixel 8, эмулятор
        - ОС: Android 16
        - Коммит / версия: abc1234
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительно
      description: Логи, ссылки, что уже пробовали
