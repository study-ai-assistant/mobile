# ЗАГОТОВКА CI.
#CI: проверка обязательных файлов, линтер (lintDebug) и юнит-тесты (testDebugUnitTest).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  required-files:
    name: Обязательные файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить наличие обязательных файлов
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "::error::Не найден обязательный файл: $f"
              missing=1
            fi
          done
          exit $missing

  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Запустить линтер
        run: |
          chmod +x gradlew
          ./gradlew lintDebug

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Запустить тесты
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
